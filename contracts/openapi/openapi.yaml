openapi: 3.0.3
info:
  title: Alemedu API
  description: >
    عقد الـ API الرسمي لمنصة Alemedu التعليمية.
    راجع docs/api-contract.md للشرح النصي المرافق.
    يغطي هذا الملف كل مسار مسجَّل فعليًا في services/api/internal/router/router.go —
    لا يوجد مسار غير موثَّق هنا.
  version: "0.2.0"
servers:
  - url: https://api.alemedu.com
    description: إنتاج
  - url: https://staging-api.alemedu.com
    description: اختبار
  - url: http://localhost:8080
    description: محلي

tags:
  - name: system
    description: فحص الصحة والربط الخارجي
  - name: auth
  - name: onboarding
  - name: curriculum
    description: قراءة عامة (لا تتطلب مصادقة)
  - name: attempts
    description: محرك الاختبارات
  - name: progress
  - name: mistakes
  - name: daily-plan
  - name: achievements
  - name: parent
  - name: settings
    description: هوية الموقع (عام)
  - name: feature-flags
    description: أعلام الميزات (عام)
  - name: admin-curriculum
  - name: admin-questions
  - name: admin-users
  - name: admin-feature-flags
  - name: admin-reports
  - name: admin-settings

paths:
  # ============================= النظام =============================
  /health:
    get:
      tags: [system]
      summary: فحص صحة الخادم
      responses:
        "200": { description: الخادم يعمل }

  /r:
    get:
      tags: [system]
      summary: إعادة توجيه من موقع الإيمان الخارجي مع تتبّع UTM
      parameters:
        - name: to
          in: query
          schema: { type: string }
      responses:
        "302": { description: إعادة توجيه }

  # ============================= المصادقة =============================
  /auth/register:
    post:
      tags: [auth]
      summary: إنشاء حساب جديد (يرسل رابط تفعيل بريد ويضبط كوكي رمز التحديث)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                displayName: { type: string }
      responses:
        "201":
          description: تم إنشاء الحساب
          headers:
            Set-Cookie: { schema: { type: string }, description: "refresh_token (HttpOnly)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      tags: [auth]
      summary: تسجيل الدخول (يضبط كوكي رمز التحديث)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: تم تسجيل الدخول
          headers:
            Set-Cookie: { schema: { type: string }, description: "refresh_token (HttpOnly)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      tags: [auth]
      summary: تسجيل الخروج (يلغي الجلسة ويمحو كوكي رمز التحديث)
      responses:
        "204": { description: تم تسجيل الخروج }

  /auth/refresh:
    post:
      tags: [auth]
      summary: تجديد رمز الوصول من كوكي رمز التحديث (HttpOnly، لا جسم طلب)
      responses:
        "200":
          description: رمز وصول جديد + كوكي مُدوَّرة
          headers:
            Set-Cookie: { schema: { type: string }, description: "refresh_token جديدة (rotation)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: طلب استعادة كلمة المرور (استجابة ثابتة دائمًا — لا كشف عن وجود الحساب)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: تم إرسال رابط الاستعادة إن وُجد الحساب }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/reset-password:
    post:
      tags: [auth]
      summary: إعادة تعيين كلمة المرور برمز الاستعادة
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200": { description: تم تحديث كلمة المرور }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/me:
    get:
      tags: [auth]
      summary: بيانات المستخدم الحالي
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: المستخدم الحالي
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/change-password:
    post:
      tags: [auth]
      summary: تغيير كلمة المرور (يلغي كل الجلسات القديمة ويصدر رمزًا جديدًا لهذه الجلسة)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          description: تم التغيير — رمز جلسة جديد
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: تفعيل البريد الإلكتروني برمز مُرسَل بالبريد
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: "تم التفعيل: { verified: true }" }
        "400": { description: رابط غير صالح أو منتهي }

  /auth/resend-verification:
    post:
      tags: [auth]
      summary: إعادة إرسال رابط تفعيل البريد للمستخدم الحالي
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: أُعيد الإرسال (أو الحساب مفعَّل أصلًا) }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/oauth/{provider}:
    get:
      tags: [auth]
      summary: بدء تسجيل الدخول عبر Google/Facebook (تنقّل متصفح مباشر)
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, facebook] }
      responses:
        "302": { description: إعادة توجيه لصفحة موافقة المزوّد }
        "502": { description: المزوّد غير مفعَّل على هذا الخادم (صفحة HTML) }

  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      summary: عودة المزوّد بعد الموافقة — يضبط كوكي الجلسة ويعيد التوجيه لصفحة الواجهة
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, facebook] }
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "302":
          description: إعادة توجيه إلى {WEB_BASE_URL}/oauth-callback بلا أي رمز في الرابط
          headers:
            Set-Cookie: { schema: { type: string }, description: "refresh_token (HttpOnly)" }
        "502": { description: فشل التبادل أو الحساب (صفحة HTML) }

  # ============================= التهيئة =============================
  /onboarding/options:
    get:
      tags: [onboarding]
      summary: خيارات التهيئة (الصفوف/المواد المتاحة)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: قائمة الخيارات }

  /onboarding/complete:
    post:
      tags: [onboarding]
      summary: إكمال تهيئة حساب الطالب
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gradeId, subjectIds]
              properties:
                gradeId: { type: string, format: uuid }
                subjectIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200": { description: تمت التهيئة }

  # ============================= المنهاج (عام) =============================
  /grades:
    get:
      tags: [curriculum]
      summary: قائمة الصفوف
      responses:
        "200": { description: قائمة الصفوف }

  /grades/{gradeId}/subjects:
    get:
      tags: [curriculum]
      parameters:
        - $ref: "#/components/parameters/GradeId"
      responses:
        "200": { description: مواد الصف }

  /subjects/{subjectId}:
    get:
      tags: [curriculum]
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200": { description: تفاصيل المادة }

  /subjects/{subjectId}/units:
    get:
      tags: [curriculum]
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200": { description: وحدات المادة }

  /units/{unitId}/lessons:
    get:
      tags: [curriculum]
      parameters:
        - $ref: "#/components/parameters/UnitId"
      responses:
        "200": { description: دروس الوحدة }

  /lessons/{lessonId}:
    get:
      tags: [curriculum]
      parameters:
        - $ref: "#/components/parameters/LessonId"
      responses:
        "200": { description: تفاصيل الدرس }

  /lessons/{lessonId}/quiz:
    get:
      tags: [curriculum]
      summary: اختبار الدرس المرتبط (لبدء الاختبار عبر /quizzes/{quizId}/start)
      parameters:
        - $ref: "#/components/parameters/LessonId"
      responses:
        "200": { description: مرجع الاختبار (id, type, title) }
        "404": { description: لا يوجد اختبار لهذا الدرس بعد }

  # ============================= الاختبارات =============================
  /diagnostic/start:
    post:
      tags: [attempts]
      summary: بدء الاختبار التشخيصي (أسئلة موزَّعة عبر مهارات المادة)
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: محاولة جديدة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptView" }
        "409": { description: "onboarding_required — أكمل تهيئة الحساب أولًا" }

  /quizzes/{quizId}/start:
    post:
      tags: [attempts]
      summary: بدء اختبار (درس/وحدة/مراجعة)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: quizId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: محاولة جديدة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptView" }
        "404": { description: الاختبار غير موجود }

  /attempts/{attemptId}:
    get:
      tags: [attempts]
      summary: استئناف محاولة (نسخة السؤال مجمَّدة عند بدء المحاولة)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: حالة المحاولة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /attempts/{attemptId}/answers:
    post:
      tags: [attempts]
      summary: حفظ إجابة فورًا (idempotent لكل questionId ضمن المحاولة)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, answer]
              properties:
                questionId: { type: string, format: uuid }
                answer: { $ref: "#/components/schemas/AnswerPayload" }
                timeSpentMs: { type: integer }
      responses:
        "200": { description: "{ saved: true }" }
        "409": { description: المحاولة منتهية بالفعل }
        "422": { description: إجابة غير صالحة لهذا النوع من الأسئلة }

  /attempts/{attemptId}/submit:
    post:
      tags: [attempts]
      summary: تسليم المحاولة وحساب النتيجة (ذرّي بالكامل — معاملة واحدة داخل الخادم)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: تم التسليم (استدعاء مكرر يعيد نفس النتيجة المحفوظة — idempotent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptResult" }

  /attempts/{attemptId}/result:
    get:
      tags: [attempts]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: نتيجة محاولة مسلَّمة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptResult" }
        "404": { description: لم تُسلَّم المحاولة بعد }

  # ============================= التقدم =============================
  /progress:
    get:
      tags: [progress]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: التقدم العام
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressOverview" }

  /progress/subjects/{subjectId}:
    get:
      tags: [progress]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: خريطة تقدم مادة تفصيلية (وحدات → دروس → مهارات)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubjectProgress" }

  /progress/skills:
    get:
      tags: [progress]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: تقدم كل المهارات
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SkillProgress" }

  /progress/skills/{skillId}:
    get:
      tags: [progress]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SkillId"
      responses:
        "200": { description: تقدم مهارة محددة مع تفسير التصنيف وعدد الإجابات الخاطئة }

  # ============================= دفتر الأخطاء =============================
  /mistakes:
    get:
      tags: [mistakes]
      summary: دفتر الأخطاء الكامل (غير المتقنة)، مع السؤال كاملًا للمراجعة التفاعلية
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: قائمة الأخطاء
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MistakeItem" }

  /mistakes/due:
    get:
      tags: [mistakes]
      summary: الأخطاء المستحقة للمراجعة الآن فقط
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: قائمة الأخطاء المستحقة
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MistakeItem" }

  /mistakes/{mistakeId}/review:
    post:
      tags: [mistakes]
      summary: تصحيح إجابة مراجعة داخل الخادم (Grade فعلي، ليس تقييمًا ذاتيًا) وإعادة الجدولة
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MistakeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { $ref: "#/components/schemas/AnswerPayload" }
      responses:
        "200": { description: "{ newState, correct } — correct محسوبة من الخادم حصرًا" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: إجابة غير صالحة لنوع هذا السؤال }

  # ============================= المهمة اليومية =============================
  /daily-plan:
    get:
      tags: [daily-plan]
      summary: خطة اليوم إن وُجدت (null إن لم تُولَّد بعد)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: "{ plan: DailyPlan | null }"

  /daily-plan/generate:
    post:
      tags: [daily-plan]
      summary: توليد خطة اليوم (عديمة الأثر الجانبي المكرر — استدعاء ثانٍ يعيد نفس الخطة)
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: تم توليد/إعادة الخطة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyPlan" }
        "409": { description: "no_subject — لا مادة مسجَّلة للطالب" }

  /daily-tasks/{taskId}/start:
    post:
      tags: [daily-plan]
      summary: بدء مهمة (يستأنف محاولة قائمة لنفس المهمة إن وُجدت بدل إنشاء أخرى)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: نتيجة البدء
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartTaskResult" }
        "409": { description: "task_finished — المهمة مكتملة بالفعل" }

  /daily-tasks/{taskId}/complete:
    post:
      tags: [daily-plan]
      summary: إكمال مهمة يدويًا (مهام الاختبار تُكمَل تلقائيًا عند التسليم)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200": { description: "{ completed: true }" }

  # ============================= الإنجازات =============================
  /achievements:
    get:
      tags: [achievements]
      summary: كل الإنجازات مع حالة كل منها (محقَّق/غير محقَّق)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: قائمة الإنجازات
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Achievement" }

  # ============================= ولي الأمر =============================
  /parent/link-requests:
    post:
      tags: [parent]
      summary: طلب ربط بولي الأمر الحالي مع طالب عبر بريده (يتطلب دور parent)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentEmail]
              properties:
                studentEmail: { type: string, format: email }
      responses:
        "201": { description: "{ requested: true }" }
        "404": { description: لا يوجد حساب طالب بهذا البريد }

  /parent/link-requests/incoming:
    get:
      tags: [parent]
      summary: طلبات الربط المعلَّقة الموجَّهة للطالب الحالي (يتطلب دور student)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: قائمة الطلبات
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncomingLinkRequest" }

  /parent/link-requests/{parentId}/respond:
    post:
      tags: [parent]
      summary: موافقة/رفض الطالب على طلب ربط (يتطلب دور student)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: parentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                approve: { type: boolean }
      responses:
        "200": { description: "{ status: active | revoked }" }
        "404": { description: لا يوجد طلب معلَّق بهذا الشكل }

  /parent/children:
    get:
      tags: [parent]
      summary: تقدّم مبسَّط لكل طالب مرتبط فعليًا (يتطلب دور parent)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: قائمة الأبناء وتقدمهم
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChildProgress" }

  # ============================= عام: هوية الموقع + أعلام الميزات =============================
  /settings:
    get:
      tags: [settings]
      summary: هوية الموقع العامة (اسم/شعار/عنوان/تواصل اجتماعي/جاهزية OAuth) — بلا مصادقة
      responses:
        "200":
          description: إعدادات الموقع العامة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSiteSettings" }

  /feature-flags:
    get:
      tags: [feature-flags]
      summary: أعلام الميزات المفعَّلة فقط (بلا نسبة الإطلاق) — بلا مصادقة
      responses:
        "200":
          description: خريطة مفتاح → مفعَّل
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlagsMap" }

  # ============================= الإدارة: المنهاج =============================
  /admin/curricula/grades:
    get:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: قائمة الصفوف (لوحة الإدارة)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminGrade" } }
    post:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, level]
              properties:
                name: { type: string }
                level: { type: integer }
      responses:
        "201": { description: "{ id }" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/curricula/subjects:
    post:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gradeId, name, slug]
              properties:
                gradeId: { type: string, format: uuid }
                name: { type: string }
                slug: { type: string }
      responses:
        "201": { description: "{ id }" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/subjects/{id}/books:
    get:
      tags: [admin-curriculum]
      summary: كتب المادة (طالب/تمارين/معلم) مع آخر نتيجة تحليل AI لكل كتاب (docs/ai-curriculum-roadmap.md — E10)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: قائمة كتب المادة, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminSubjectBook" } } } } }
    post:
      tags: [admin-curriculum]
      summary: رفع كتاب PDF لمادة (يستبدل كتابًا سابقًا من نفس النوع)، ويُشغّل تحليل AI غير متزامن عبر ai_jobs
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, bookType]
              properties:
                file: { type: string, format: binary }
                bookType: { type: string, enum: [student, exercises, teacher] }
      responses:
        "201": { description: "{ id, url }" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/units:
    get:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subjectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: قائمة الوحدات, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminUnit" } } } } }
    post:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, name]
              properties:
                subjectId: { type: string, format: uuid }
                name: { type: string }
                order: { type: integer }
      responses:
        "201": { description: "{ id }" }

  /admin/units/{id}:
    put:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                order: { type: integer }
                isActive: { type: boolean }
      responses:
        "200": { description: "{ updated: true }" }

  /admin/lessons:
    get:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unitId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: قائمة الدروس, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminLesson" } } } } }
    post:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitId, name]
              properties:
                unitId: { type: string, format: uuid }
                name: { type: string }
                summary: { type: string }
                order: { type: integer }
      responses:
        "201": { description: "{ id }" }

  /admin/lessons/{id}:
    put:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                summary: { type: string }
                order: { type: integer }
                isActive: { type: boolean }
      responses:
        "200": { description: "{ updated: true }" }

  /admin/skills:
    get:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: قائمة المهارات, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminSkill" } } } } }
    post:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, lessonIds]
              properties:
                name: { type: string }
                description: { type: string }
                difficulty: { type: string, enum: [easy, medium, hard] }
                lessonIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "201": { description: "{ id }" }

  /admin/skills/{id}:
    put:
      tags: [admin-curriculum]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                difficulty: { type: string, enum: [easy, medium, hard] }
                lessonIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "200": { description: "{ updated: true }" }

  /admin/quizzes:
    get:
      tags: [admin-curriculum]
      summary: قائمة الاختبارات (للقراءة فقط — تُنشأ تلقائيًا عند نشر أول سؤال في الدرس)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: قائمة الاختبارات, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminQuiz" } } } } }

  # ============================= الإدارة: الأسئلة =============================
  /admin/questions:
    get:
      tags: [admin-questions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, in_review, changes_requested, approved, published, archived] }
        - name: lessonId
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string }
          description: بحث نصي في محتوى السؤال
      responses:
        "200": { description: قائمة الأسئلة (مع usage/errorRate/openReports), content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QuestionSummary" } } } } }
    post:
      tags: [admin-questions]
      summary: إنشاء سؤال جديد كمسودة (يتحقق من تسلسل المنهج وملكية المهارات للدرس)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveQuestionInput" }
      responses:
        "201": { description: "{ id }" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/questions/ai-draft:
    post:
      tags: [admin-questions]
      summary: توليد مسودة سؤال single_choice عبر Together AI (docs/ai-curriculum-roadmap.md — E04)، تمر بنفس تحقق الإنشاء البشري قبل الحفظ كمسودة
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIDraftInput" }
      responses:
        "201": { description: "{ id, model }" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { description: رد مزوّد AI غير صالح أو لم يجتز التحقق (ai_invalid_response | ai_invalid_draft) }
        "503": { description: توليد الأسئلة عبر AI غير مُفعَّل (ai_not_configured — TOGETHER_API_KEY غير مضبوط) }

  /admin/questions/{id}:
    get:
      tags: [admin-questions]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: تفاصيل السؤال الكاملة, content: { application/json: { schema: { $ref: "#/components/schemas/QuestionDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin-questions]
      summary: تحرير السؤال — تعديل بعد النشر ينشئ نسخة جديدة؛ أي تعديل أثناء in_review/approved يعيده إلى draft
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveQuestionInput" }
      responses:
        "200": { description: "{ updated: true, newVersionCreated: boolean }" }
        "409": { description: لا يمكن تعديل سؤال مؤرشف }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [admin-questions]
      summary: حذف — للمسودات التي لم تُنشر أبدًا فقط
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: تم الحذف }
        "409": { description: غير قابل للحذف — استخدم الأرشفة }

  /admin/questions/{id}/submit-review:
    post:
      tags: [admin-questions]
      summary: إرسال للمراجعة (draft/changes_requested → in_review)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: "{ status: in_review }" }
        "409": { description: انتقال حالة غير صالح }

  /admin/questions/{id}/review:
    post:
      tags: [admin-questions]
      summary: قرار المراجع (approved | changes_requested)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, changes_requested] }
                comment: { type: string }
      responses:
        "200": { description: "{ status }" }
        "409": { description: السؤال ليس قيد المراجعة حاليًا }

  /admin/questions/{id}/publish:
    post:
      tags: [admin-questions]
      summary: نشر أحدث إصدار معتمد (ينشئ اختبار الدرس تلقائيًا عند أول نشر فيه)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: "{ status: published, quizId }" }
        "409": { description: لم يُعتمَد بعد }
        "422": { description: "unsupported_type — نوع matching لا يملك تصحيحًا تلقائيًا بعد" }

  /admin/questions/{id}/archive:
    post:
      tags: [admin-questions]
      summary: أرشفة (يختفي من الاختبارات الجديدة، تبقى محاولات الطلاب القديمة سليمة)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: "{ status: archived }" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/questions/{id}/media:
    post:
      tags: [admin-questions]
      summary: رفع صورة لأحدث إصدار من السؤال
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: "{ id, url }" }
        "422": { description: نوع/حجم ملف غير مسموح }
    get:
      tags: [admin-questions]
      summary: صور آخر إصدار من السؤال
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: قائمة الصور, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QuestionMedia" } } } } }

  /admin/reviews:
    get:
      tags: [admin-questions]
      summary: اختصار — أسئلة بحالة in_review فقط (نفس شكل رد /admin/questions)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: قائمة الأسئلة قيد المراجعة, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QuestionSummary" } } } } }

  # ============================= الإدارة: المستخدمون =============================
  /admin/users:
    get:
      tags: [admin-users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role
          in: query
          schema: { type: string }
      responses:
        "200": { description: قائمة المستخدمين, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } } }

  /admin/users/{id}/role:
    put:
      tags: [admin-users]
      summary: تغيير دور مستخدم — حصرًا لـ admin/super_admin؛ admin عادي لا يستطيع تعديل دور مستخدم إداري آخر
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [student, parent, content_editor, content_reviewer, support, admin] }
      responses:
        "200": { description: "{ role }" }
        "403": { description: أدمن عادي يحاول تعديل مستخدم إداري آخر }
        "404": { $ref: "#/components/responses/NotFound" }

  # ============================= الإدارة: أعلام الميزات =============================
  /admin/feature-flags:
    get:
      tags: [admin-feature-flags]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: كل الأعلام مع نسبة الإطلاق, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminFeatureFlag" } } } } }

  /admin/feature-flags/{key}:
    put:
      tags: [admin-feature-flags]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isEnabled: { type: boolean }
                rolloutPercentage: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200": { description: تم التحديث }

  # ============================= الإدارة: التقارير =============================
  /admin/reports/overview:
    get:
      tags: [admin-reports]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: مؤشرات تشغيل, content: { application/json: { schema: { $ref: "#/components/schemas/ReportsOverview" } } } }

  /admin/reports/content-issues:
    get:
      tags: [admin-reports]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: بلاغات المحتوى, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ContentIssue" } } } } }

  /admin/reports/content-issues/{id}/resolve:
    post:
      tags: [admin-reports]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: "{ status: resolved }" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/reports/audit-logs:
    get:
      tags: [admin-reports]
      summary: سجل التدقيق الكامل — admin/super_admin فقط
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: سجل التدقيق, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditLogEntry" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ============================= الإدارة: إعدادات الموقع =============================
  /admin/settings:
    get:
      tags: [admin-settings]
      summary: إعدادات الموقع كاملة (بلا كلمة مرور SMTP الفعلية) — admin/super_admin فقط
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: الإعدادات, content: { application/json: { schema: { $ref: "#/components/schemas/AdminSiteSettings" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin-settings]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSiteSettingsInput" }
      responses:
        "200": { description: "{ updated: true }" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/settings/logo:
    post:
      tags: [admin-settings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: "{ url }" }
        "422": { description: نوع/حجم ملف غير مسموح }

  /admin/settings/favicon:
    post:
      tags: [admin-settings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: "{ url }" }
        "422": { description: نوع/حجم ملف غير مسموح }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GradeId:
      name: gradeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitId:
      name: unitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SkillId:
      name: skillId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MistakeId:
      name: mistakeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: خطأ تحقق من المدخلات
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: غير مصرح
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: ممنوع (لا يملك صلاحية الوصول لهذا المورد)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: تعارض (مثل بريد مستخدم مسبقًا)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: غير موجود
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: محاولات كثيرة جدًا (20 طلب/دقيقة لكل IP على المسارات الحساسة)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [student, parent, content_editor, content_reviewer, support, admin, super_admin] }
        onboardingCompleted: { type: boolean }
        emailVerified: { type: boolean }

    AuthResponse:
      type: object
      description: >
        لا يوجد حقل refreshToken هنا عمدًا — يصل عبر كوكي HttpOnly لا تراها
        جافاسكربت إطلاقًا (Set-Cookie في ترويسة الرد).
      properties:
        accessToken: { type: string }
        user: { $ref: "#/components/schemas/User" }

    AnswerPayload:
      description: شكلها يعتمد على نوع السؤال
      oneOf:
        - type: object
          properties: { optionId: { type: string, format: uuid } }
        - type: object
          properties: { optionIds: { type: array, items: { type: string, format: uuid } } }
        - type: object
          properties: { value: { type: number } }
        - type: object
          properties: { orderedOptionIds: { type: array, items: { type: string, format: uuid } } }

    SanitizedOption:
      type: object
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        order: { type: integer }

    SanitizedQuestion:
      type: object
      description: سؤال بلا كشف الإجابة الصحيحة — الشكل الوحيد المرسَل قبل التسليم
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [single_choice, true_false, numeric_input, multi_select, ordering, matching] }
        body: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/SanitizedOption" } }
        answered: { type: boolean }

    Attempt:
      type: object
      properties:
        id: { type: string, format: uuid }
        quizId: { type: string, format: uuid }
        type: { type: string, enum: [diagnostic, lesson, unit, review, daily] }
