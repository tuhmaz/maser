# infrastructure/nginx/staging.conf
# نفس بنية production.conf لكن على منافذ/نطاقات staging منفصلة تمامًا،
# بقاعدة بيانات وعمليات مستقلة (راجع docs/deployment-plan.md).

upstream alemedu_staging_web {
    server 127.0.0.1:3100;
}

upstream alemedu_staging_admin {
    server 127.0.0.1:3101;
}

upstream alemedu_staging_api {
    server 127.0.0.1:8180;
}

server {
    listen 443 ssl http2;
    server_name staging.alemedu.com;

    ssl_certificate     /etc/letsencrypt/live/staging.alemedu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.alemedu.com/privkey.pem;

    # لا فهرسة لبيئة الاختبار
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://alemedu_staging_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name staging-api.alemedu.com;

    ssl_certificate     /etc/letsencrypt/live/staging-api.alemedu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.alemedu.com/privkey.pem;

    location / {
        proxy_pass http://alemedu_staging_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name staging-admin.alemedu.com;

    ssl_certificate     /etc/letsencrypt/live/staging-admin.alemedu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-admin.alemedu.com/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://alemedu_staging_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
