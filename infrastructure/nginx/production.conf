# infrastructure/nginx/production.conf
# قوالب Nginx لبيئة الإنتاج. عدّل مسارات شهادات SSL بعد إصدارها (Let's Encrypt/certbot).
# راجع docs/deployment-plan.md.

upstream alemedu_web {
    server 127.0.0.1:3000;
}

upstream alemedu_admin {
    server 127.0.0.1:3001;
}

upstream alemedu_api {
    server 127.0.0.1:8080;
}

# --- alemedu.com : واجهة الطالب ---
server {
    listen 80;
    server_name alemedu.com www.alemedu.com;
    return 301 https://alemedu.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name alemedu.com;

    ssl_certificate     /etc/letsencrypt/live/alemedu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alemedu.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://alemedu_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- api.alemedu.com : الخدمة الخلفية ---
server {
    listen 80;
    server_name api.alemedu.com;
    return 301 https://api.alemedu.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.alemedu.com;

    ssl_certificate     /etc/letsencrypt/live/api.alemedu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.alemedu.com/privkey.pem;

    location / {
        proxy_pass http://alemedu_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- admin.alemedu.com : لوحة الإدارة (فصل منطقي عن الواجهة العامة) ---
server {
    listen 80;
    server_name admin.alemedu.com;
    return 301 https://admin.alemedu.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.alemedu.com;

    ssl_certificate     /etc/letsencrypt/live/admin.alemedu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.alemedu.com/privkey.pem;

    # حماية إضافية: يمكن تقييد الوصول بعنوان IP هنا عند الحاجة (allow/deny)
    location / {
        proxy_pass http://alemedu_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
