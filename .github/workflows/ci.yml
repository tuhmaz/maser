name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # يفحص كل الفروع والتاريخ بحثًا عن أسرار مسرَّبة (مفاتيح API، توكنات،
  # كلمات مرور) قبل الدمج — لا اعتماديات إضافية، gitleaks يعمل بدون توكن
  # خارجي على نسخة محلية من المستودع.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: فحص الأسرار المسرَّبة (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-and-worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alemedu
          POSTGRES_PASSWORD: alemedu
          POSTGRES_DB: alemedu_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"

      - name: تفعيل امتدادات Postgres المطلوبة
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=alemedu psql -h localhost -U alemedu -d alemedu_ci -c \
            "CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS citext;"

      # هذا يطبّق كل ترحيل فعليًا على قاعدة نظيفة في كل تشغيل CI — يمنع دمج أي
      # ترحيل مكسور أو غير ذرّي أو برقم مكرر (كان المشروع بلا هذا الحارس إطلاقًا).
      - name: تطبيق الترحيلات على قاعدة نظيفة
        env:
          DATABASE_URL: postgres://alemedu:alemedu@localhost:5432/alemedu_ci?sslmode=disable
        run: bash scripts/migrate.sh up

      - name: gofmt (api)
        run: |
          out="$(gofmt -l ./services/api)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: gofmt (worker)
        run: |
          out="$(gofmt -l ./services/worker)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: gofmt (togetherai)
        run: |
          out="$(gofmt -l ./libs/togetherai)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: go vet (togetherai)
        working-directory: libs/togetherai
        run: go vet ./...

      - name: go build (togetherai)
        working-directory: libs/togetherai
        run: go build ./...

      - name: go vet (api)
        working-directory: services/api
        run: go vet ./...

      - name: go vet (worker)
        working-directory: services/worker
        run: go vet ./...

      - name: go build (api)
        working-directory: services/api
        run: go build ./...

      - name: go build (worker)
        working-directory: services/worker
        run: go build ./...

      - name: go test (api)
        working-directory: services/api
        run: go test ./...

      - name: go test (worker)
        working-directory: services/worker
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Typecheck web
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Typecheck admin
        working-directory: apps/admin
        run: npx tsc --noEmit

      - name: Build web
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Build admin
        working-directory: apps/admin
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  migrations-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # يكرر مشكلة "0008 مكرر" التي وقعت فعليًا في هذا المشروع — يفشل الدمج
      # فورًا بدل اكتشافها لاحقًا في قاعدة إنتاج فعلية.
      - name: لا ترقيم مكرر، ولا up.sql بلا down.sql مقابل
        run: |
          cd services/api/migrations
          dupes="$(ls *.up.sql | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "ترقيم ترحيل مكرر: $dupes" >&2
            exit 1
          fi
          for f in *.up.sql; do
            down="${f%.up.sql}.down.sql"
            if [ ! -f "$down" ]; then
              echo "لا يوجد down.sql مقابل لـ $f" >&2
              exit 1
            fi
          done
          echo "OK"

  # اختبار عقد: يعيد توليد عميل TypeScript من contracts/openapi/openapi.yaml
  # ويقارنه بالملف المحفوظ في المستودع. أي اختلاف يعني أن أحدهما تغيّر دون
  # الآخر (مسار أُضيف للراوتر ولم يُوثَّق، أو العكس) — يفشل الدمج فورًا بدل
  # أن ينجرف العقد عن الكود الفعلي بصمت.
  openapi-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: إعادة توليد عميل TypeScript من العقد
        working-directory: packages/api-client
        run: npm run generate

      - name: التحقق أن الناتج مطابق للمحفوظ في المستودع
        run: |
          # git diff وحده لا يكتشف ملفًا جديدًا غير متتبَّع بعد — status يغطي الحالتين.
          status="$(git status --porcelain -- packages/api-client/src/generated/schema.ts)"
          if [ -n "$status" ]; then
            echo "عميل TypeScript المولَّد غير متزامن مع contracts/openapi/openapi.yaml." >&2
            echo "شغّل: npm run generate --workspace=packages/api-client ثم ادمج الناتج." >&2
            git diff -- packages/api-client/src/generated/schema.ts >&2
            exit 1
          fi
          echo "OK: العقد والعميل متطابقان."

  # يشغّل الخوادم الثلاثة فعليًا (API + web + admin) على قاعدة Postgres حقيقية
  # مُهاجَرة، ثم يقود متصفح Chromium حقيقي عبر السيناريوهات الحرجة — راجع
  # e2e/README.md. هذا أبطأ وأثقل من بقية مهام CI عمدًا؛ يفشل الدمج لو انكسر
  # أي مسار حرج فعليًا في متصفح حقيقي، لا فقط في اختبارات الوحدة.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alemedu
          POSTGRES_PASSWORD: alemedu
          POSTGRES_DB: alemedu_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://alemedu:alemedu@localhost:5432/alemedu_e2e?sslmode=disable
      API_BASE_URL: http://localhost:8080
      WEB_BASE_URL: http://localhost:3000
      ADMIN_BASE_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: تفعيل امتدادات Postgres وتطبيق الترحيلات
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS citext;"
          bash scripts/migrate.sh up

      - name: إنشاء حساب أدمن للاختبار (نفس بيانات e2e/tests/support/admin.ts)
        run: |
          PSQL_CMD="psql $DATABASE_URL" scripts/create-admin.sh admin@alemedu.com 'Admin@12345'

      - run: npm ci

      - name: بناء وتشغيل خادم الـAPI في الخلفية
        working-directory: services/api
        run: |
          go build -o /tmp/alemedu-api ./cmd/api
          JWT_ACCESS_SECRET="ci-only-secret-not-for-production-use-32chars" \
            DATABASE_URL="$DATABASE_URL" WEB_BASE_URL="$WEB_BASE_URL" \
            CORS_ALLOWED_ORIGINS="$WEB_BASE_URL,$ADMIN_BASE_URL" \
            /tmp/alemedu-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break || sleep 1; done

      - name: بناء وتشغيل تطبيقي الطالب والإدارة في الخلفية
        run: |
          npm run build --workspace=apps/web
          npm run build --workspace=apps/admin
          npx --workspace=apps/web next start -p 3000 > /tmp/web.log 2>&1 &
          npx --workspace=apps/admin next start -p 3001 > /tmp/admin.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 > /dev/null && break || sleep 1; done
          for i in $(seq 1 30); do curl -sf http://localhost:3001 > /dev/null && break || sleep 1; done

      - name: تثبيت متصفح Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: تشغيل اختبارات Playwright
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
